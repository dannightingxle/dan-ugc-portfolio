<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f9fc;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:32px">
            <tr><td style="font-size:22px;font-weight:800;letter-spacing:-0.5px">Creator <span style="color:#2563eb">Desk</span></td></tr>
            <tr><td style="padding-top:24px;font-size:20px;font-weight:700">Confirm your email</td></tr>
            <tr><td style="padding-top:12px;font-size:15px;line-height:1.6;color:#475569">Thanks for signing up to Creator Desk. Confirm your email to carry on - you'll go straight to starting your free trial.</td></tr>
            <tr>
              <td style="padding-top:24px">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=%2Fhub%2Fbilling%3Fstart%3D1" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:10px">Confirm my email</a>
              </td>
            </tr>
            <tr><td style="padding-top:24px;font-size:13px;line-height:1.6;color:#8391a7">Didn't sign up? You can ignore this email.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
