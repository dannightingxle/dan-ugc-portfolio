<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f9fc;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:32px">
            <tr><td style="font-size:22px;font-weight:800;letter-spacing:-0.5px">Creator <span style="color:#2563eb">Desk</span></td></tr>
            <tr><td style="padding-top:24px;font-size:20px;font-weight:700">Reset your password</td></tr>
            <tr><td style="padding-top:12px;font-size:15px;line-height:1.6;color:#475569">Someone (hopefully you) asked to reset the password for your Creator Desk account. This link works once and expires soon.</td></tr>
            <tr>
              <td style="padding-top:24px">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=%2Fhub%2Faccount%3Freset%3D1" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:10px">Choose a new password</a>
              </td>
            </tr>
            <tr><td style="padding-top:24px;font-size:13px;line-height:1.6;color:#8391a7">Didn't ask for this? You can ignore this email - your password won't change.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
