# Reposts existing reels as altered trial reels every morning. Setup: INSTAGRAM.md.
name: Trial reels

on:
  schedule:
    - cron: "7 6 * * *" # 06:07 UTC = 7:07am UK summer time, 6:07am winter
  workflow_dispatch:
    inputs:
      count:
        description: How many to post now (blank = TRIAL_REELS_PER_DAY)
        required: false
      dry_run:
        description: Only list what would be posted
        type: boolean
        default: false

concurrency: trial-reels

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Font for the hidden captions
        run: test -d /usr/share/fonts/truetype/dejavu || (sudo apt-get update && sudo apt-get install -y fonts-dejavu-core)
      - run: node scripts/trial-reels.mts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TRIAL_REELS_PER_DAY: ${{ vars.TRIAL_REELS_PER_DAY }}
          TRIAL_REELS_GRADUATION: ${{ vars.TRIAL_REELS_GRADUATION }}
          COUNT: ${{ inputs.count }}
          DRY_RUN: ${{ inputs.dry_run }}
